project:
  name: minecraft_ai
  version: 0.1.0
  author: Dennis Zhang
  description: Human-like Minecraft AI using pixel-only vision and simulated inputs.
  created: '2026-02-25'
capture:
  backend: mss
  window_title_query: Minecraft
  fps_limit: 60
  downscale: 1.0
  ui_scale: 2
  fov: 90
  track_window_each_frame: true
  strict_window_find: true
  use_client_area: true
  clamp_to_monitor: true
  show_frame_stats: false
  benchmark_on_start: false
vision:
  world:
    enabled: true
    block_classifier: baseline
    entity_classifier: null
    h_fov_deg: 90
    patch_grid_size:
    - 6
    - 4
    patch_size_px: 24
    margin_left_px: 80
    margin_right_px: 80
    margin_top_px: 120
    margin_bottom_px: 180
    max_walk_distance: 16.0
    crosshair_reach_blocks: 5.0
    min_block_confidence: 0.25
    entity_detect_every_n_ticks: 4
    use_sample_recognizer: true
    auto_sample_from_looking_at: true
    sample_cooldown_ticks: 6
    sample_capture_px: 32
    sample_reload_every_n_saves: 3
    # CONSERVATIVE MODE: only blocks the AI directly looked at via F3
    # "Targeted Block" go into the WorldMap. Vision-patch guesses,
    # sample-NN matches, inverse-renderer cross-validation, and
    # F3-seed neighbour expansion are all DISABLED — they exist in
    # code but are gated behind this flag for future re-enablement
    # after the heuristic-quality issues are sorted out.
    commit_only_from_looking_at: true

    # ── HUD / hand exclusion zones ───────────────────────────────
    # Pixel rectangles where the camera sees the player's HOTBAR or
    # their first-person HAND — patches that fall inside are
    # ignored. Tuned for the calibrated 1920x1129 capture; adjust
    # via tools/window_inspector.py if the GUI scale changes.
    exclude_rects:
      - [760, 1030, 410, 100]      # hotbar + health/hunger bars
      - [1200,  700, 720, 430]     # first-person hand bottom-right

    strict_commit_gate: true
    sample_commit_confidence: 0.92
    min_samples_for_commit: 30   # require this many labelled samples on
                                  # disk before sample-NN can commit a block
    curiosity_queue_max: 256
    # Inverse-rendering ground-truth expansion. When F3 confirms a
    # voxel, project neighbouring voxels' visible faces to the
    # screen, sample the actual pixels, and compare against the
    # canonical texture for the same block. Confident matches commit
    # as "extrapolation" — one F3 confirm becomes many confirmed
    # neighbours for floors / walls / tree trunks.
    use_inverse_renderer:           true
    expand_score_min:               0.55
    expand_neighbour_radius:        2
    expand_max_voxels_per_tick:     32
    # Cross-validate curiosity-queue entries every tick against the
    # inverse renderer: when patch sweep + texture geometry agree
    # on the same block id, commit (no F3 needed).
    inverse_validate_curiosity:     true
    inverse_validate_score_min:     0.62
    inverse_validate_max_per_tick:  8
    carve_air_along_sightlines: true
    use_f3_depth_anchor: true
    default_anchor_depth: 4.0
    depth_search_radius: 6.0
  hud_regions:
