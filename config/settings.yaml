project:
  name: minecraft_ai
  version: 0.1.0
  author: Dennis Zhang
  description: Human-like Minecraft AI using pixel-only vision and simulated inputs.
  created: '2026-02-25'
capture:
  backend: mss
  window_title_query: Minecraft
  fps_limit: 60
  downscale: 1.0
  ui_scale: 2
  fov: 90
  # Grab frames on a background thread so the ~16-30 ms screen grab
  # never blocks the agent loop. The control loop reads the most-recent
  # frame instantly. Set to false to force synchronous grabs.
  threaded: true
  track_window_each_frame: true
  strict_window_find: true
  use_client_area: true
  clamp_to_monitor: true
  show_frame_stats: false
  benchmark_on_start: false
vision:
  world:
    enabled: true
    block_classifier: baseline
    entity_classifier: null
    h_fov_deg: 90
    patch_grid_size:
    - 6
    - 4
    patch_size_px: 24
    # Patch-sweep bounding box. These margins exclude regions of the
    # frame that are ALWAYS UI (not world):
    #   * top  220 → clears MC's full F3 panel header (Minecraft
    #                version / biome / FPS / mem stats lines that
    #                render from y≈0..200 when F3 is held)
    #   * bot  200 → clears the hotbar (already covered by an
    #                exclude_rect, but the margin keeps the patch
    #                grid from spending ANY of its 24 slots there)
    #   * left/right 80 → minimal trim of the screen edges where the
    #                Minecraft block-fog gradient lives
    # Additional UI holes (crosshair, F3 right column, hand) are
    # masked by the exclude_rects block below — those are points
    # INSIDE the grid that should also be skipped per-patch.
    margin_left_px: 80
    margin_right_px: 80
    margin_top_px: 220
    margin_bottom_px: 200
    max_walk_distance: 16.0
    crosshair_reach_blocks: 5.0
    min_block_confidence: 0.25
    entity_detect_every_n_ticks: 4
    use_sample_recognizer: true
    auto_sample_from_looking_at: true
    sample_cooldown_ticks: 6
    # Capture 48×48 actual pixels around the crosshair. After the cross
    # arms are inpainted away (mask_crosshair_in_samples) there's still
    # plenty of surrounding block surface for the recogniser to learn
    # from. Bigger = more context but also more cross to remove and
    # more risk of straddling a block boundary; smaller = nothing left
    # after masking.
    sample_capture_px: 48
    sample_reload_every_n_saves: 3
    # Inpaint MC's crosshair (15-GUI-px '+') out of every saved sample
    # so future training learns the underlying block texture instead
    # of the synthetic cross. Geometry knobs cover non-vanilla
    # crosshairs (resource packs / overlay mods).
    mask_crosshair_in_samples: true
    crosshair_arm_half_len_gui:   8
    crosshair_arm_half_thick_gui: 1
    # Diagnostic — dumps the latest F3 OCR text every 100 ticks so
    # you can see WHY blocks aren't being logged. Turn this off
    # once the agent is reliably committing. The dump only shows
    # the parse result + the first 240 chars of raw text.
    debug_f3_dump: true
    # ── Commit gate ──────────────────────────────────────────────
    # When ``true`` the WorldMap holds ONLY blocks F3's "Targeted
    # Block" line confirmed directly. When ``false`` the sample-NN
    # recogniser also commits patches it confidently identifies
    # anywhere in the gameplay region — multiplying map growth per
    # tick at the cost of accepting a small false-positive rate
    # (gated by ``sample_commit_confidence`` + ``min_samples_for_commit``
    # below). Flip after the sample dataset has accumulated enough
    # diverse captures.
    commit_only_from_looking_at: false

    # ── UI exclusion zones ───────────────────────────────────────
    # Reference resolution that exclude_rects + margins are tuned
    # against. At capture time the actual frame size is divided by
    # this reference and every pixel-space value (margins, rects) is
    # scaled accordingly — so windowed MC, different monitors, and
    # the player resizing the window all keep the hotbar / hand /
    # F3 panel correctly masked without re-calibration.
    frame_ref_resolution: [1920, 1129]

    # Pixel rectangles inside the patch-sweep bounding box where the
    # camera sees UI rather than world. Patch CENTRES landing in any
    # of these rects are skipped — without it the classifier would
    # confidently label crosshair pixels as a "block" or sample F3
    # text as a wall.
    #
    # Format: [x, y, w, h]. Coordinates are FRAME pixels at
    # ``frame_ref_resolution`` (above). Adjust via
    # tools/window_inspector.py + a few one-off captures if the GUI
    # scale or window aspect changes substantially.
    exclude_rects:
      # Crosshair at frame centre (1920/2, 1094/2) = (960, 547). The
      # 15-GUI-px '+' renders as a ~30×30 region; 60×60 buffer covers
      # any subtle anti-aliased edge plus a margin for the attack
      # indicator that sometimes overlays the crosshair.
      - [930, 517, 60, 60]
      # F3 panel RIGHT column (when F3 is held / always-lines show).
      # Right column runs from ~x=1300 to the right edge, top of
      # frame down to about y=560 with the full panel rendered.
      # Always-lines (player_position etc.) live inside this same
      # box, so the rect is correct either way.
      - [1300, 0, 620, 560]
      # Hotbar + health / hunger / armour / xp bars.
      - [760, 1030, 410, 100]
      # First-person hand bottom-right quadrant.
      - [1200, 700, 720, 430]

    strict_commit_gate: true
    # Confidence floor for a vision_patch commit. The sample-NN's
    # ``confidence`` is a blend of top-K agreement + normalised
    # margin; well-recognised vine / short_grass / grass_block
    # patches typically score 0.85-0.95. The per-block sample gate
    # (``min_samples_per_block_for_commit``) already prevents
    # baseline-classifier hallucinations from passing, so the
    # confidence floor's role is only to drop genuinely ambiguous
    # patches inside the trained-block set. 0.85 is the
    # post-per-block-gate sweet spot — high enough to skip
    # near-misses, low enough to actually commit the bulk of clear
    # foliage / ground patches the NN sees every tick.
    sample_commit_confidence: 0.85
    min_samples_for_commit: 30   # require this many labelled samples on
                                  # disk before sample-NN can commit a block
    # Per-block sample floor. A prediction for, say, ``acacia_leaves``
    # is only trusted if the sample store actually has ≥N captures of
    # acacia_leaves on disk. Without this gate, the
    # HybridBlockClassifier's colour-signature fallback (1157 generic
    # MC block templates) can label random foliage / dirt patches as
    # whatever the closest template is — flooding the WorldMap with
    # blocks we've never trained on. Unbacked predictions still go
    # to the curiosity queue so the player can teach them via F3.
    min_samples_per_block_for_commit: 20
    curiosity_queue_max: 256
    # Inverse-rendering ground-truth expansion. When F3 confirms a
    # voxel, project neighbouring voxels' visible faces to the
    # screen, sample the actual pixels, and compare against the
    # canonical texture for the same block. Confident matches commit
    # as "extrapolation" — one F3 confirm becomes many confirmed
    # neighbours for floors / walls / tree trunks.
    use_inverse_renderer:           true
    expand_score_min:               0.55
    expand_neighbour_radius:        2
    expand_max_voxels_per_tick:     32
    # Unified per-tick wall-clock budget (ms) for ALL heavy perception
    # work (expansion + curiosity cross-validation + patch sweep). Keeps
    # the control loop near its target rate in block-dense scenes; the
    # map just fills a little slower. 0 = no cap. Kept modest (12 ms) so
    # the main thread releases the GIL quickly and the F3 OCR worker
    # (pose / looking-at — the priority) gets CPU instead of being
    # starved by inverse-render expansion / patch-sweep.
    perception_time_budget_ms:      12
    # Skip redundant re-commit/re-expansion on control ticks that reuse
    # the same (threaded-OCR) pose; map growth tracks the OCR cadence.
    skip_stale_pose_updates:        true
    # Cross-validate curiosity-queue entries every tick against the
    # inverse renderer: when patch sweep + texture geometry agree
    # on the same block id, commit (no F3 needed).
    inverse_validate_curiosity:     true
    inverse_validate_score_min:     0.62
    inverse_validate_max_per_tick:  8
    carve_air_along_sightlines: true
    use_f3_depth_anchor: true
    default_anchor_depth: 4.0
    depth_search_radius: 6.0
    # Recognise weather from the screen each tick (clear/rain/snow/
    # thunder/unknown) and attach it to the WorldFrame + tag block
    # samples with it. See vision.weather and tools/collect_weather.py.
    detect_weather: true
    # Weather changes over minutes — re-check at most this often (sec) and
    # hold the verdict in between, so the F3 OCR (pose / looking-at) gets
    # the CPU/GIL instead of a per-tick weather scan.
    weather_check_interval_sec: 5.0
  # Weather recogniser tuning. The heuristic works out of the box;
  # collecting command-labelled samples (tools/collect_weather.py)
  # builds a trained classifier that supersedes it.
  weather:
    smooth_window: 9            # majority-vote over the last N frames
    min_samples_per_state: 8    # trained classifier needs >=this per state
    cave_open_frac: 0.18        # below this fraction of open sky -> unknown
  ocr:
    # Run F3 OCR on a background thread (requires capture.threaded). The
    # control loop reads the latest pose instantly instead of blocking
    # on the ~70 ms read. read_interval_sec paces the worker; the read
    # itself takes ~70 ms so values below that just mean "read as fast
    # as possible". ~0.12 s gives ~6-8 Hz pose updates (vs the old 3 Hz)
    # while leaving a CPU core free for perception.
    threaded: true
    # 0 = read back-to-back (fire as fast as the ~70 ms read allows,
    # ~12-14 Hz) for maximum pose / looking-at throughput. The interval
    # only adds delay when set ABOVE the read time; raise it (e.g. 0.1)
    # to cap OCR and free CPU if the control loop needs it.
    read_interval_sec: 0.0
    # Cap F3 line scanning. The F3 fields we need (XYZ, Block, Facing,
    # Targeted Block, block id, Chunk, dimension) all live in the
    # first ~5 lines of each column at half-line stride; line steps
    # past that are pure overhead. Dropping from 25 -> 8 cuts F3 OCR
    # from ~430 ms to ~80 ms per cycle on the user's machine, which
    # was the dominant bottleneck of the main agent loop.
    max_lines: 8
  hud_regions:
    hotbar_region:
    - 778
    - 1084
    - 364
    - 44
    xp_bar:
    - 778
    - 1070
    - 364
    - 10
    health_bar:
    - 778
    - 1050
    - 162
    - 18
    hunger_bar:
    - 980
    - 1050
    - 162
    - 18
    armor_bar:
    - 778
    - 1030
    - 162
    - 18
    crosshair_center:
    - 960
    - 564
  hud_extended:
    hotbar_slot_rects:
    - - 780
      - 1086
      - 40
      - 40
    - - 820
      - 1086
      - 40
      - 40
    - - 860
      - 1086
      - 40
      - 40
    - - 900
      - 1086
      - 40
      - 40
    - - 940
      - 1086
      - 40
      - 40
    - - 980
      - 1086
      - 40
      - 40
    - - 1020
      - 1086
      - 40
      - 40
    - - 1060
      - 1086
      - 40
      - 40
    - - 1100
      - 1086
      - 40
      - 40
    hotbar_slot_centers:
    - - 800
      - 1106
    - - 840
      - 1106
    - - 880
      - 1106
    - - 920
      - 1106
    - - 960
      - 1106
    - - 1000
      - 1106
    - - 1040
      - 1106
    - - 1080
      - 1106
    - - 1120
      - 1106
control:
  keyboard:
    allow_repeat_press: false
    strict_state: true
    tap_default: 0.06
    max_actions_per_sec: 120
    debounce_ms: 10
    sprint_mode: hold
    sneak_mode: hold
    autorun_enabled: false
  mouse:
    # Tuned for humanlike camera control. The agent ticks at 20 Hz
    # (50 ms / tick); each ``track_target`` call eases the requested
    # delta over ~48 ms with 20 micro-steps, so the cursor is
    # continuously moving with very fine per-frame increments. Lower
    # ``curve_steps`` produces a more stepped feel; higher costs CPU.
    move_duration_ms: 48
    flick_multiplier: 0.35
    curve_steps: 20
    default_click_duration: 0.05
    max_events_per_sec: 480           # high cap so the easing micro-steps
                                       # are never rate-limited
    enable_scroll: true

    # Absolute screen-cursor reach (humanlike easing for menus /
    # inventory hovers). Used by ``Mouse.move_to_screen_xy``; never
    # touches gameplay camera (that uses the relative-delta APIs
    # above). Defaults below are tuned to feel like a deliberate hand
    # reach — minimum-jerk velocity profile, slight perpendicular
    # bow, sub-pixel wobble.
    screen_move:
      min_ms:    80      # short hops still take at least this long
      max_ms:    450     # cap for big diagonal traversals
      ms_per_px: 0.6     # base distance scaling (linear)
      step_hz:   240     # micro-step cadence; matches velocity worker
      curvature: 0.06    # perpendicular bow as fraction of distance
      jitter_px: 0.4     # per-step random offset to break the curve

# Reserved hotbar slots by ROLE. Behaviours (mining, eating, bridging)
# look up the slot for a role via control/hotbar.py instead of hard-coding
# slot numbers, and can flag when a slot holds the wrong item. Roles:
# sword | axe | pickaxe | shovel | hoe | blocks | food | armor.
hotbar:
  slot_roles:
    1: sword
    2: pickaxe
    3: axe
    4: boat          # boats get their own quick-access slot (operator request)
    5: hoe
    6: blocks
    7: food
    8: shovel
  extra_food: []          # extra item stems to treat as food (e.g. modded)
safety:
  check_focus_interval: 0.075
  auto_stop_on_focus_loss: true
  allow_run_without_focus: false
  assume_focused_when_unknown: false
  # Tolerance for capture vs. calibration size mismatch (per axis, in
  # pixels). Below this we warn but still run; above this we still
  # warn — there is no hard abort. The HUD coordinates in
  # ``vision.hud_regions`` were measured at the calibrated resolution,
  # so HUD-dependent agents (Navigation eating food, etc.) may degrade
  # if the offset is large. World-perception is unaffected because it
  # rebuilds its screen-ray from the actual capture each tick.
  capture_size_tolerance_px: 64
  focus_loss_debounce_ms: 250
  startup_focus_grace_ms: 800
  debug_focus_trace: false
  log_actions: true
  log_focus_events: true
  print_status_table: true
  emergency_hotkey:
  - <ctrl>
  - <shift>
  - <f12>
logging:
  level: info
  save_to_file: true
  file_path: logs/runtime.log
  rotate_logs: true
  overlays:
    draw_crosshair: false
    draw_block_outlines: false
    draw_mob_detection: false
    draw_hotbar_state: false
agent:
  default_agent: world_explorer    # scan-only mode — see agent.world_explorer below
  max_runtime_sec: 30
  tick_rate: 20
  action_rate: 60
  allow_hotbar_scroll: false
  # Autonomous tree-chopper (python main.py --agent treechop). Needs
  # vision.world.enabled + hotbar.slot_roles (axe/blocks). Breaks logs +
  # leaves only.
  treechop:
    max_logs: 9999                 # stop after chopping this many trunks
    eat_below: 0.45                # eat from the food slot below this hunger (0-1; 0 disables)
  # Generic block gatherer (python main.py --agent harvest) — same find ->
  # navigate -> mine -> collect FSM as treechop, for any block type.
  harvest:
    match: ["stone", "cobblestone"]  # gather blocks whose id contains any of these
    tool: pickaxe                    # hotbar role to select for mining them
    max_blocks: 9999
    eat_below: 0.45
  # Goal/planner (python main.py --agent planner): run an ordered plan,
  # advancing when each behaviour reports DONE (count reached / area cleared).
  planner:
    eat_below: 0.45
    tasks:
      - {kind: logs, count: 8}
      - {kind: block, match: ["stone", "cobblestone"], tool: pickaxe, count: 16}
  prefer_hotkeys_for_hotbar: true
  humanlike_reaction_time_ms: 60
  jitter_ms: 20
  planning:
    enabled: false
    planner_type: hierarchical
    max_depth: 12
  world_model:
    enabled: false
    imagination_rollouts: 0
    use_latent_model: false
  world_explorer:
    # ── Phase 2: curiosity-driven investigate ─────────────────────
    # Systematic 360° plan still runs FIRST (one full pass) to seed
    # ground truth and grow F3-confirmed extrapolations. After that
    # the agent drops into reactive SCAN ↔ INVESTIGATE:
    #   * SCAN: pan camera, let perception fill the curiosity queue
    #   * INVESTIGATE: pop the freshest queue entry, aim crosshair
    #     at the voxel, wait for F3 "Looking at block" to confirm
    #     or contradict the guess, save a labelled sample, repeat.
    # This closes the self-improvement loop: every unknown-block
    # guess turns into either a new sample (correct) or a recorded
    # correction (wrong → tighten gate / discard guess).
    scan_only_mode:  false
    loop_systematic: false

    # All mouse-motion knobs tuned for HUMANLIKE easing (no flicks).
    # Effective speed limits (at MC sensitivity 100 %, ~6.5 px/°):
    #   * yaw scan rate         ≈ 9°/sec  (2 px/tick × 20 Hz / 6.5 px/°)
    #   * max yaw correction    ≈ 25 px/tick ≈ 3.8°/tick
    #   * approach gain         0.20 → most yaw errors converge in 5–8 ticks
    # This is well below the "twitch" range; should read as a smooth
    # human glance, not a flick.
    mouse_per_degree: 6.5
    mouse_gain: 0.20
    max_mouse_dx: 25
    max_mouse_dy: 20
    aim_tolerance_deg: 1.4
    investigate_max_ticks: 140       # extra budget for the gentler gain
    close_confirm_grace_ticks: 12
    max_reach_blocks: 5.0
    scan_yaw_pixels_per_tick: 2      # ~9°/sec — slow, deliberate pan
    # Velocity for the systematic 360° sweep. The default is 18°/s
    # which feels human but takes ~20s per sweep. In reactive mode
    # (``scan_only_mode: false``) the short systematic plan
    # (orient + sweep_level) runs ONCE before handing off to INVESTIGATE
    # — so we'd rather get through it quickly. 30°/s is still well
    # under "twitch" speed (humans casually turn at 100°/s+) but
    # cuts the warmup from ~25s to ~15s.
    scan_yaw_deg_per_sec: 30.0
    scan_pitch_amplitude_deg: 25.0
    scan_pitch_period_ticks: 360     # 18 s sweep
    scan_pitch_center_deg: 25.0      # biased downward
    scan_ticks_before_investigate: 14
    no_target_pitch_down_after_ticks: 30
    no_target_pitch_down_per_tick: 4  # gentle pitch-down
    # Curiosity-queue priority: "in_view" prefers voxels currently in
    # front of the camera over voxels behind (which would require a
    # 140°+ rotation to confirm — usually times out). "closest" is
    # the legacy spatial-distance pick.
    queue_priority: in_view
  navigation:
    target_x: null
    target_z: null
    stop_distance: 2.5
    yaw_tolerance_deg: 6.0
    mouse_per_degree: 6.5
    mouse_gain: 0.45
    max_mouse_dx: 140
    walk_when_aligned_within: 35.0
    sprint: false
    auto_target_forward_blocks: 25.0
    eat_below_hunger: 0.0
    food_slot: 9
    eat_hold_ticks: 30
  pathwalker:
    # A* pathfinder + waypoint follower. Set target_x/y/z to drive the
    # agent to a specific voxel; leave null to keep the agent idle
    # (useful for higher-level autonomous agents that build on
    # WalkerController). All other fields fall back to WalkerConfig
    # defaults — they're listed here for discoverability.
    target_x: -89
    target_y: 91
    target_z: -94
    arrived_tolerance: 0.8
    arrived_y_tol: 1.5
    waypoint_tolerance: 0.65
    aim_tolerance_deg: 6.0
    aim_p_gain: 0.7
    aim_max_deg_per_sec: 90.0
    # Pitch-level controller — keeps the head roughly horizontal
    # while walking so F3 picks up the block in front and the agent
    # doesn't sprint forward with its head stuck pointing at the sky
    # (a common post-systematic-scan handoff state).
    target_pitch_deg: 5.0
    pitch_p_gain: 0.5
    pitch_max_deg_per_sec: 25.0
    mouse_per_degree: 6.5
    stuck_progress_window: 30
    stuck_min_progress: 0.1
    stuck_replan_retries: 2
    # Pathfinder knobs:
    #   * unknown_policy: "ground_only" (default) | "passable"
    #   * max_fall_blocks: 3 (safe drops)
    #   * max_nodes_expanded: 20_000 (A* budget)
    unknown_policy: passable
    max_fall_blocks: 3
    max_nodes_expanded: 50000
training:
  enable_training_mode: false
  data_path: data/
  batch_size: 32
  image_size:
  - 1920
  - 1080
  il:
    enabled: false
    dataset_path: data/training/
    model_out: models/il_policy.pt
  rl:
    enabled: false
    reward_shaping: true
    max_steps: 20000
debug:
  god_mode: false
  force_focus_true: false
  print_every_action: false
  show_mouse_vectors: false
  show_keyboard_events: false
  capture_profile: false
developer:
  enable_hot_reload: false
  print_import_graph: false
  disable_capture: false
  disable_mouse: false
  disable_keyboard: false
  auto_focus_window: true
  window_title_query: Minecraft
  ensure_unpaused: true
  unpause_max_attempts: 3
  unpause_delay_ms: 120
  fake_capture_frames: false
  fake_window_focus: false
calibration:
  require_focus: true
  try_auto_focus: true
  try_unpause: true
  fps_during_calibration: 30
extensions:
  openai_tools: false
  internet_lookup: false
  tutorial_learning: false
  farm_builder: false
  chunk_scanner: false
vision_calibration:
  last:
    resolution:
    - 1920
    - 1128
    ui_scale: 2
    timestamp: 1779561191
    source: vision.calibration_formula
