  window_title_query: Minecraft
  fps_limit: 60
  downscale: 1.0
  ui_scale: 2
  fov: 90
  track_window_each_frame: true
  strict_window_find: true
  use_client_area: true
  clamp_to_monitor: true
  show_frame_stats: false
  benchmark_on_start: false
