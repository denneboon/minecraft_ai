# Project metadata + tool config.
#
# This project uses a FLAT-layout (no src/ directory). Every top-level
# folder under the repo root (vision/, control/, agents/, brain/,
# knowledge/, config/, utils/) is its own importable package; entry-
# point scripts live in tools/ and scripts/. The flat layout keeps
# absolute imports short (``from vision.world import WorldPerception``)
# at the cost of needing the repo root on sys.path — which it
# automatically is when you run ``python main.py`` from the repo root
# or install the project with ``pip install -e .``.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-ai"
version = "0.1.0"
description = "Pixel-only Minecraft AI: reads the screen, drives mouse + keyboard, no in-game data."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Dennis Zhang" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: Developers",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Development Status :: 3 - Alpha",
]
# Runtime deps are duplicated in requirements.txt because pip on
# Windows with PyTorch CUDA wheels often wants the index-url pinned
# manually — requirements.txt remains the canonical install path.
# This list mirrors the import statements actually used in the code.
dependencies = [
    "numpy>=2.0",
    "mss>=10.0",
    "opencv-python>=4.10",
    "Pillow>=11.0",
    "pynput>=1.8",
    "PyYAML>=6.0",
    "pygetwindow>=0.0.9",
    "psutil>=5.9",
    'pywin32>=306; platform_system == "Windows"',
]

[project.optional-dependencies]
ml = [
    "torch>=2.5",
    "torchvision>=0.20",
    "scikit-learn>=1.6",
]
ocr = [
    # The Tesseract LSTM backend is only a fallback for when the
    # extracted MC font cache cannot be built — vision/glyph_ocr.py
    # is the primary path.
    "pytesseract>=0.3.10",
]
viz = [
    "matplotlib>=3.9",
    "rich>=13.7",
    "tqdm>=4.66",
]
schema = [
    "jsonschema>=4.23",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.urls]
# Replace with a real URL once the project is published.
Homepage = "https://github.com/denneboon/minecraft_ai"

# ---------------------------------------------------------------------------
# Setuptools: discover the flat-layout packages explicitly so we don't
# accidentally ship venv/, tools/, scripts/ or experiments/ in a wheel.
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = [
    "agents*",
    "brain*",
    "config*",
    "control*",
    "knowledge*",
    "utils*",
    "vision*",
]
exclude = [
    "venv*", "tests*", "tools*", "scripts*", "experiments*",
    "data*", "docs*", "models*",
]

[tool.setuptools.package-data]
config = ["*.yaml", "*.json"]
knowledge = ["internal/*.json", "schemas/*.json"]

# ---------------------------------------------------------------------------
# Pytest discovery
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "live: tests that need a running Minecraft instance (skipped by default).",
    "slow: tests that take more than a second.",
]

# ---------------------------------------------------------------------------
# Ruff — lint + format. The config is intentionally light; we don't
# enforce any opinionated styles, only catch genuine mistakes.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["venv", "data", "experiments", "models"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes (unused imports / variables)
    "W",      # pycodestyle warnings
    "B",      # flake8-bugbear (likely bugs)
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line-too-long — handled by formatter
    "B008",   # function call in default argument — used for dataclass field defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
